# Lives in the PUBLIC repo JeremiePineau/terminallyllm-releases (copied from release-repo/ in the
# private source repo). Public repos get free Actions minutes; Actions are turned OFF on the private repo.
# Builds every platform from the private source, then publishes one release per version (v<version>),
# with the installers and update feeds electron-updater reads anonymously, and keeps only that release.
name: Build installers
on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag in terminallyllm"
        default: main
      platforms:
        description: "Installers to build"
        type: choice
        default: all
        options: [all, windows, linux, macos]
      notes:
        description: "Release notes: what changed (optional)"
        default: ""
      publish:
        description: "Publish to the latest release (off = dry run: build, sign, check, keep the installers as a short-lived artifact)"
        type: boolean
        default: true
# Read-only by default; only the publish job, which creates the release, may write (least privilege).
permissions:
  contents: read
env:
  SOURCE_REPO: JeremiePineau/terminallyllm
jobs:
  plan:
    # Minutes are free only while this repo is PUBLIC. If it is ever made private, nothing runs
    # (every job below depends on this one), so it can never bill the account.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      ref: ${{ steps.pick.outputs.ref }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        shell: bash
        # Inputs reach the script as environment variables, never pasted into it (no script injection),
        # and the ref must look like a branch, tag or commit.
        env:
          IN_PLATFORMS: ${{ github.event.inputs.platforms || github.event.client_payload.platforms || 'all' }}
          IN_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          IN_PUBLISH: ${{ github.event.inputs.publish || github.event.client_payload.publish || 'true' }}
        run: |
          want="$IN_PLATFORMS"; ref="$IN_REF"
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ && "$ref" != *..* ]] || { echo "::error::not a branch, tag or commit: $ref"; exit 1; }
          linux='{"os":"ubuntu-latest","artifact":"linux"}'
          windows='{"os":"windows-latest","artifact":"windows"}'
          macos='{"os":"macos-latest","artifact":"macos"}'
          case "$want" in
            windows) matrix="[$windows]" ;; linux) matrix="[$linux]" ;; macos) matrix="[$macos]" ;;
            *) matrix="[$linux,$windows,$macos]" ;;
          esac
          # A release dispatch publishes unless it says otherwise; a manual run follows its checkbox.
          publish="$IN_PUBLISH"
          [ "$publish" = false ] || publish=true
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"; echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "publish=$publish" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    permissions:
      contents: read
      id-token: write  # build provenance: the workflow's identity for the Sigstore signature
      attestations: write  # build provenance: stored with this repository's attestations
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Notarization waits on Apple, usually a few minutes but sometimes much longer.
    timeout-minutes: ${{ matrix.artifact == 'macos' && 75 || 40 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to a commit (a moved tag can't change what runs with the deploy key)
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}   # a read-only deploy key on terminallyllm (nothing else)
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned to a commit
        with:
          node-version: 22
          cache: npm
      # npm ci installs the node-pty prebuild for THIS runner's OS (@lydell/node-pty-<os>-<arch>).
      - run: npm ci
      # The runner is Apple Silicon, so npm ci only installed node-pty's arm64 prebuild; the x64 app
      # needs the Intel one too. Same version as the lockfile, unpacked beside it (the loader picks by arch).
      - name: Add node-pty's Intel prebuild (macOS)
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package-lock.json').packages['node_modules/@lydell/node-pty-darwin-x64'].version")
          d=node_modules/@lydell/node-pty-darwin-x64; mkdir -p "$d"
          tgz=$(npm pack "@lydell/node-pty-darwin-x64@$v" --silent --pack-destination "$RUNNER_TEMP")
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$d" --strip-components=1
          ls "$d"
      - name: Unit tests
        shell: bash
        run: |
          # Only the NAMES of failing tests are printed: vitest's diffs and code frames would put
          # private source in these public logs.
          if ! npx vitest run --reporter=json --outputFile=results.json > test.log 2>&1; then
            node -e 'const r=require("./results.json");for(const f of r.testResults)for(const t of f.assertionResults)if(t.status==="failed")console.log("::error::failed: "+t.fullName)' || true
            echo "::error::unit tests failed (details withheld, logs here are public)"; exit 1
          fi
      - name: Compile (output withheld; tsc and vite print source and these logs are public)
        shell: bash
        run: |
          if ! npm run build > compile.log 2>&1; then
            echo "::error::compile failed on the public runner. Re-run the build locally to see the error."
            exit 1
          fi
      - name: Package
        if: matrix.artifact != 'macos'
        run: npx electron-builder --publish never
      # The signing secrets reach this one step only (never the Windows or Linux jobs, never other steps).
      - name: Package, sign and notarize (macOS)
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing: refusing to build an unsigned Mac app"; exit 1; }
          done
          key="$RUNNER_TEMP/notary-key.p8"; trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key" )
          export APPLE_API_KEY="$key"
          unset APPLE_API_KEY_B64
          npx electron-builder --publish never
      # Never ship a Mac build that isn't Developer ID signed, notarized and stapled, with the native
      # terminal module inside it signed too.
      - name: Check the signature and notarization (macOS)
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for app in release/mac*/TerminallyLLM.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dvv "$app" 2>&1)
            grep -q '^Authority=Developer ID Application:' <<<"$info" || { echo "::error::$app is not Developer ID signed"; exit 1; }
            grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::$app lacks the hardened runtime"; exit 1; }
            grep -E '^(Authority|TeamIdentifier|Timestamp)=' <<<"$info"
            spctl -a -vv -t exec "$app"
            xcrun stapler validate "$app"
            n=0
            while IFS= read -r f; do codesign --verify --strict "$f" || { echo "::error::unsigned native file: $f"; exit 1; }; n=$((n+1)); done \
              < <(find "$app/Contents/Resources/app.asar.unpacked" -type f \( -name '*.node' -o -name 'spawn-helper' \))
            [ "$n" -gt 0 ] || { echo "::error::no node-pty native files found in $app"; exit 1; }
            echo "native files signed: $n"
          done
          ls release/mac/TerminallyLLM.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell | grep -q darwin-x64 || { echo "::error::the x64 app has no Intel node-pty"; exit 1; }
          ls release/*.dmg release/*.zip release/latest-mac.yml
      # The packaged app must start and run a shell on the runner's OS (macOS especially: nobody
      # here owns a Mac). Linux needs a virtual display; Windows runners have no WSL distro, so skip.
      - name: Smoke test the packaged app
        if: matrix.artifact != 'windows'
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ matrix.artifact }}" = macos ]; then
            # The runner is Apple Silicon: smoke-test the arm64 app (the x64 one would need Rosetta).
            app=$(ls -d release/mac-arm64/TerminallyLLM.app 2>/dev/null || ls -d release/mac*/TerminallyLLM.app | head -1); bin="$app/Contents/MacOS/TerminallyLLM"
            # macOS has no `timeout`; perl's alarm is the portable equivalent.
            ( perl -e 'alarm shift; exec @ARGV' 120 "$bin" --smoketest || true )
          else
            sudo apt-get install -y -qq xvfb >/dev/null
            ( timeout 120 xvfb-run -a release/linux-unpacked/terminallyllm --smoketest --no-sandbox || true )
          fi
          f="$(node -p "require('os').tmpdir()")/TerminallyLLM-smoketest/out/smoke.json"
          [ -f "$f" ] || { echo "::error::the packaged app didn't write $f (did it start?)"; exit 1; }
          cat "$f"
          node -e 'const r=require(process.argv[1]); if(!r.ok){console.log("::error::smoke test failed: "+JSON.stringify(r)); process.exit(1)}' "$f"
      # Signed build provenance (SLSA, Sigstore) for every file published: anyone can check that an
      # installer or update feed was built by this workflow, from which source commit, with
      # `gh attestation verify <file> -R JeremiePineau/terminallyllm-releases` (docs: VERIFY.md).
      - name: Attest build provenance
        id: provenance
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, pinned to a commit
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
      # The signed bundle also goes on the release, next to the installers (verifiers that read
      # release files, like OpenSSF Scorecard, look for it there).
      - name: Keep the provenance bundle with the release
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "release/TerminallyLLM-provenance-${{ matrix.artifact }}.sigstore.json"
      - name: Check this platform's release files
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        run: |
          set -uo pipefail
          case "${{ matrix.artifact }}" in
            windows) need=(release/*.exe release/*.exe.blockmap release/TerminallyLLM-provenance-windows.sigstore.json release/latest.yml) ;;
            macos)   need=(release/*.dmg release/*.zip release/*.zip.blockmap release/TerminallyLLM-provenance-macos.sigstore.json release/latest-mac.yml) ;;
            linux)   need=(release/*.AppImage release/*.deb release/TerminallyLLM-provenance-linux.sigstore.json release/latest-linux.yml) ;;
          esac
          for f in "${need[@]}"; do [ -f "$f" ] || { echo "::error::missing $f (no update metadata means no updates)"; exit 1; }; done
      # Nothing is published from here: the files go to the publish job, which releases every platform at
      # once. A dry run keeps them a few days, so a signed Mac build can be tried before any release.
      - name: Hand the files on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, pinned to a commit
        with:
          name: release-${{ matrix.artifact }}
          retention-days: ${{ needs.plan.outputs.publish == 'true' && 1 || 3 }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.sigstore.json

  # One release per version (v<version>), published only once every platform built, signed and passed its
  # checks: users never see a half-uploaded release, and a stalled platform delays the release instead of
  # splitting it. Then only that release is kept: older releases and their tags are deleted.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # create this version's release, delete older ones
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, pinned to a commit
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish this version, keep only it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
          NOTES: ${{ github.event.inputs.notes || github.event.client_payload.notes || '' }}
        run: |
          set -euo pipefail
          cd out
          # A release carries every platform: a partial one would leave some feeds missing.
          for feed in latest.yml latest-mac.yml latest-linux.yml; do [ -f "$feed" ] || { echo "::error::$feed missing: a release needs every platform (build one platform with a dry run)"; exit 1; }; done
          ver=$(grep -E '^version:' latest.yml | awk '{print $2}' | tr -d "'\"")
          for feed in latest-mac.yml latest-linux.yml; do
            v=$(grep -E '^version:' "$feed" | awk '{print $2}' | tr -d "'\"")
            [ "$v" = "$ver" ] || { echo "::error::$feed says $v, latest.yml says $ver"; exit 1; }
          done
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version: $ver"; exit 1; }
          tag="v$ver"
          { echo "TerminallyLLM $ver"; echo
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Download the file for your platform below; see the [README](https://github.com/$THIS_REPO#download) for which one, and [VERIFY.md](https://github.com/$THIS_REPO/blob/main/VERIFY.md) to check it. Every release's notes: [CHANGELOG.md](https://github.com/$THIS_REPO/blob/main/CHANGELOG.md)."
            echo; echo "Built from source \`$SOURCE_REF\` by [this workflow run]($RUN_URL). Every file has signed build provenance."
          } > ../notes.md
          files=(*)
          if gh release view "$tag" -R "$THIS_REPO" >/dev/null 2>&1; then
            # A rebuild of the same version: replace its files in place (each upload is atomic).
            gh release upload "$tag" -R "$THIS_REPO" "${files[@]}" --clobber
            gh release edit "$tag" -R "$THIS_REPO" --notes-file ../notes.md --draft=false --latest
          else
            gh release create "$tag" -R "$THIS_REPO" --draft --target "$TARGET" --title "TerminallyLLM $ver" --notes-file ../notes.md "${files[@]}"
            gh release edit "$tag" -R "$THIS_REPO" --draft=false --latest
          fi
          echo "published $tag"
          # Only the newest version stays: older releases and their tags go (the app only ever installs the newest).
          for t in $(gh release list -R "$THIS_REPO" --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$t" != "$tag" ]; then gh release delete "$t" -R "$THIS_REPO" --cleanup-tag --yes; echo "removed release $t"; fi
          done
          for t in $(gh api "repos/$THIS_REPO/tags" --paginate -q '.[].name'); do
            if [ "$t" != "$tag" ]; then gh api -X DELETE "repos/$THIS_REPO/git/refs/tags/$t"; echo "removed tag $t"; fi
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      # Fetch every feed anonymously, as the app does (through "latest"), and resolve the file it names.
      - name: Verify the published feeds resolve
        shell: bash
        run: |
          set -uo pipefail
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          for feed in latest.yml latest-mac.yml latest-linux.yml; do
            curl -sfL "$base/$feed" -o "check-$feed" || { echo "::error::$feed is not anonymously readable"; exit 1; }
            published=$(grep -E '^version:' "check-$feed" | awk '{print $2}' | tr -d "'\"")
            [ "$published" = "$VERSION" ] || { echo "::error::$feed says $published, this release is $VERSION"; exit 1; }
            file=$(grep -E '^path:' "check-$feed" | sed -E "s/^path: *//; s/^['\"]//; s/['\"]$//")
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base/$file")
            [ "$code" = "200" ] || { echo "::error::$feed names '$file' but it returns HTTP $code"; exit 1; }
            echo "$feed verified: $VERSION -> $file"
          done
